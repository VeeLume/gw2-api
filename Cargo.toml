[package]
name = "gw2-api"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
dashmap = "6.1.0"
futures = "0.3.31"
lru = "0.16.2"
moka = { version = "0.12.11", features = ["future"] }
once_cell = "1.21.3"
phf = { version = "0.13.1", features = ["macros"] }
reqwest = "0.12.24"
schemars = "1.0.5"
serde = "1.0.228"
serde_json = "1.0.145"
serde_with = "3.15.1"
thiserror = "2.0.17"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "gw2-api-example"
path = "example/main.rs"
